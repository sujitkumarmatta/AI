[project]
name = "misfeed"
version = "0.0.1"
description = "Feed an agent a broken tool result and find out whether it notices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx2>=2.13",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
misfeed = "misfeed.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `evals` is the study driven by the harness, not part of the shipped package, so
# it is importable from the repo root rather than installed into the wheel.
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["misfeed", "evals"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/misfeed", "evals", "tests"]
